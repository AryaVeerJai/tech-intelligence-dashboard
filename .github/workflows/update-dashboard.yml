name: Update Tech Dashboard

on:
  schedule:
    - cron: '0 4 * * *'   # Daily 9:30 AM IST
  workflow_dispatch:

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.10

    - name: Install dependencies
      run: |
        pip install matplotlib requests pandas plotly

    - name: Run scripts
      run: |
        python scripts/github_trends.py
        python scripts/ai_tools_tracker.py
        python scripts/language_stats.py

    - name: Commit changes
      run: |
        git config --global user.name "AryaVeerJai"
        git config --global user.email "aryansingh879791@gmail.com"
        git add .
        git commit -m "📊 Auto update tech dashboard"
        git push
